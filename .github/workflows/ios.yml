name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ios-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Kotlin lint (iosMain source sets)
        run: |
          ./gradlew \
            :shared:ktlintIosMainSourceSetCheck \
            :core:database:ktlintIosMainSourceSetCheck \
            :core:net:ktlintIosMainSourceSetCheck \
            :core:data:ktlintIosMainSourceSetCheck \
            :core:logging:ktlintIosMainSourceSetCheck \
            :core:common:ktlintIosMainSourceSetCheck \
            :core:catalog-komga:ktlintIosMainSourceSetCheck \
            :feature:source-ui:ktlintCheck \
            :feature:reader-ui:ktlintCheck \
            :feature:player-ui:ktlintCheck \
            :feature:design-system:ktlintCheck \
            :feature:library-ui:ktlintCheck
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint (iosApp/)
        run: swiftlint lint iosApp/

  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: 'false'

      - name: Read Xcode version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Read Kotlin version
        id: kotlin-version
        run: |
          echo "version=$(grep '^kotlin = ' gradle/libs.versions.toml | sed 's/kotlin = "\(.*\)"/\1/')" >> $GITHUB_OUTPUT

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.kotlin-version.outputs.version }}

      - name: Cache SPM SourcePackages
        uses: actions/cache@v6
        with:
          path: ~/spm-packages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/derived-data
          key: derived-data-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'shared/src/iosMain/**/*.kt') }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-

      - name: Assemble Riffle XCFramework
        run: ./gradlew assembleRiffleDebugXCFramework

      - name: Select simulator
        run: |
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | SDK_VERSION="$SDK_VERSION" python3 -c "
          import json, os, re, sys
          data = json.load(sys.stdin)
          sdk = os.environ['SDK_VERSION']
          def version(key):
            m = re.search(r'iOS-(\d+)-(\d+)', key)
            return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          sdk_major = int(sdk.split('.')[0])
          keys = [k for k in data['devices'] if 'iOS' in k]
          exact = [k for k in keys if version(k) == tuple(int(x) for x in sdk.split('.')[:2])]
          same_major = [k for k in keys if version(k)[0] == sdk_major]
          ordered = exact + sorted(set(same_major) - set(exact), key=version, reverse=True) + sorted(set(keys) - set(same_major), key=version, reverse=True)
          for runtime_key in ordered:
            for d in data['devices'][runtime_key]:
              if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                print(d['udid'], runtime_key, d['name'], sep='|'); sys.exit()
          ")
          echo "Selected simulator: $UDID (SDK $SDK_VERSION)"
          UDID=${UDID%%|*}
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Build Xcode project (simulator)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme Riffle \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -configuration Debug \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" \
            -derivedDataPath "$HOME/derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

  unit-test:
    name: Unit Tests
    runs-on: macos-15
    # 50 min: K/N compilation of 29 modules + XCTest unit target; raised from 35 (too tight on slow runners).
    timeout-minutes: 50
    concurrency:
      group: ios-unit-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          java-version: '17'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Read Xcode version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Read Kotlin version
        id: kotlin-version
        run: |
          echo "version=$(grep '^kotlin = ' gradle/libs.versions.toml | sed 's/kotlin = "\(.*\)"/\1/')" >> $GITHUB_OUTPUT

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.kotlin-version.outputs.version }}

      - name: Cache SPM SourcePackages
        uses: actions/cache@v6
        with:
          path: ~/spm-packages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/derived-data
          key: derived-data-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'shared/src/iosMain/**/*.kt') }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-

      - name: Run iOS commonTest (all iOS-targeted modules)
        run: |
          ./gradlew \
            :core:common:iosSimulatorArm64Test \
            :core:models:iosSimulatorArm64Test \
            :core:net:iosSimulatorArm64Test \
            :core:sources:iosSimulatorArm64Test \
            :core:catalog-oreilly:iosSimulatorArm64Test \
            :core:sync:iosSimulatorArm64Test \
            :core:domain:iosSimulatorArm64Test \
            :core:dictionary:iosSimulatorArm64Test \
            :core:catalog:iosSimulatorArm64Test \
            :core:catalog-komga:iosSimulatorArm64Test \
            :core:catalog-gutenberg:iosSimulatorArm64Test \
            :core:catalog-radio-es:iosSimulatorArm64Test \
            :core:catalog-chitanka:iosSimulatorArm64Test \
            :shared:iosSimulatorArm64Test \
            :feature:library:iosSimulatorArm64Test \
            :feature:navigation:iosSimulatorArm64Test \
            :feature:player:iosSimulatorArm64Test \
            :feature:reader:iosSimulatorArm64Test \
            :feature:reader-ui:iosSimulatorArm64Test \
            :feature:player-ui:iosSimulatorArm64Test \
            :feature:design-system:iosSimulatorArm64Test \
            :feature:library-ui:iosSimulatorArm64Test \
            :feature:source:iosSimulatorArm64Test \
            :feature:source-ui:iosSimulatorArm64Test \
            :feature:settings:iosSimulatorArm64Test \
            :feature:settings-ui:iosSimulatorArm64Test \
            :feature:shell-ui:iosSimulatorArm64Test \
            :feature:downloads:iosSimulatorArm64Test \
            :core:logging:iosSimulatorArm64Test \
            :core:database-api:iosSimulatorArm64Test

      - name: Upload iOS commonTest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-commontest-reports
          path: |
            core/common/build/reports/tests/
            core/models/build/reports/tests/
            core/net/build/reports/tests/
            core/sources/build/reports/tests/
            core/catalog-oreilly/build/reports/tests/
            core/sync/build/reports/tests/
            core/domain/build/reports/tests/
            core/dictionary/build/reports/tests/
            core/catalog/build/reports/tests/
            core/catalog-komga/build/reports/tests/
            core/catalog-gutenberg/build/reports/tests/
            core/catalog-radio-es/build/reports/tests/
            core/catalog-chitanka/build/reports/tests/
            core/logging/build/reports/tests/
            core/database-api/build/reports/tests/
            shared/build/reports/tests/
            feature/library/build/reports/tests/
            feature/navigation/build/reports/tests/
            feature/player/build/reports/tests/
            feature/player-ui/build/reports/tests/
            feature/library-ui/build/reports/tests/
            feature/reader/build/reports/tests/
            feature/reader-ui/build/reports/tests/
            feature/design-system/build/reports/tests/
            feature/source/build/reports/tests/
            feature/source-ui/build/reports/tests/
            feature/settings/build/reports/tests/
            feature/settings-ui/build/reports/tests/
            feature/downloads/build/reports/tests/
          if-no-files-found: ignore

      # Simulator slice only; assembleRiffleDebugXCFramework also links the device framework (~5 min) unused here.
      - name: Link Riffle simulator framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Select and pre-boot simulator
        run: |
          # Match Xcode's SDK to avoid clone-launch failures with mismatched runtimes (e.g. Xcode 16.4 + iOS 26).
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | SDK_VERSION="$SDK_VERSION" python3 -c "
          import json, os, re, sys
          data = json.load(sys.stdin)
          sdk = os.environ['SDK_VERSION']
          def version(key):
            m = re.search(r'iOS-(\d+)-(\d+)', key)
            return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          sdk_major = int(sdk.split('.')[0])
          keys = [k for k in data['devices'] if 'iOS' in k]
          exact = [k for k in keys if version(k) == tuple(int(x) for x in sdk.split('.')[:2])]
          same_major = [k for k in keys if version(k)[0] == sdk_major]
          ordered = exact + sorted(set(same_major) - set(exact), key=version, reverse=True) + sorted(set(keys) - set(same_major), key=version, reverse=True)
          for runtime_key in ordered:
            for d in data['devices'][runtime_key]:
              if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                print(d['udid'], runtime_key, d['name'], sep='|'); sys.exit()
          ")
          echo "Selected simulator: $UDID (SDK $SDK_VERSION)"
          UDID=${UDID%%|*}
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl shutdown "$UDID" # parallel testing boots clones; hand the runner's cores to them

      - name: Run XCTest unit tests (iosAppUnitTests)
        run: |
          # Static K/N framework has no Xcode dependency edge; force relink so a warm cache doesn't ship stale Kotlin.
          rm -rf "$HOME"/derived-data/Build/Products/Debug-iphonesimulator/{Riffle.app,iosAppUnitTests.xctest,iosAppTests-Runner.app}
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosAppUnitTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" \
            -derivedDataPath "$HOME/derived-data" \
            -parallel-testing-enabled YES \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-unit-test.log; exit ${PIPESTATUS[0]}

      - name: Upload XCTest unit test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xctest-unit-test-log
          path: xcodebuild-unit-test.log
          if-no-files-found: ignore

  integration-test:
    name: Integration tests
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ios-integration-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          java-version: '17'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run iOS data-layer integration tests (core:data)
        run: ./gradlew :core:data:iosSimulatorArm64Test
      - name: Upload iOS integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-integration-test-reports
          path: core/data/build/reports/tests/
          if-no-files-found: ignore

  database-test:
    name: Database tests (core:database)
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ios-database-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          java-version: '17'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run iOS database tests
        run: ./gradlew :core:database:iosSimulatorArm64Test
      - name: Upload iOS database test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-database-test-reports
          path: core/database/build/reports/tests/
          if-no-files-found: ignore

  harness-test-phone:
    name: Harness tests (phone)
    runs-on: macos-15
    timeout-minutes: 120
    concurrency:
      group: ios-harness-test-phone-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: 'false'

      - name: Read Xcode version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Read Kotlin version
        id: kotlin-version
        run: |
          echo "version=$(grep '^kotlin = ' gradle/libs.versions.toml | sed 's/kotlin = "\(.*\)"/\1/')" >> $GITHUB_OUTPUT

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.kotlin-version.outputs.version }}

      - name: Cache SPM SourcePackages
        uses: actions/cache@v6
        with:
          path: ~/spm-packages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/derived-data
          # Excludes iosMain Kotlin: rm -rf forces relink on K/N changes; including Kotlin caused near-constant cache misses (~10 min extra/PR).
          key: derived-data-harness-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            derived-data-harness-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-

      # Simulator slice only; assembleRiffleDebugXCFramework also links the device framework (~5 min) unused here.
      - name: Link Riffle simulator framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Select and pre-boot simulator
        run: |
          # Match Xcode's SDK to avoid clone-launch failures with mismatched runtimes (e.g. Xcode 16.4 + iOS 26).
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | SDK_VERSION="$SDK_VERSION" python3 -c "
          import json, os, re, sys
          data = json.load(sys.stdin)
          sdk = os.environ['SDK_VERSION']
          def version(key):
            m = re.search(r'iOS-(\d+)-(\d+)', key)
            return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          sdk_major = int(sdk.split('.')[0])
          keys = [k for k in data['devices'] if 'iOS' in k]
          exact = [k for k in keys if version(k) == tuple(int(x) for x in sdk.split('.')[:2])]
          same_major = [k for k in keys if version(k)[0] == sdk_major]
          ordered = exact + sorted(set(same_major) - set(exact), key=version, reverse=True) + sorted(set(keys) - set(same_major), key=version, reverse=True)
          for runtime_key in ordered:
            for d in data['devices'][runtime_key]:
              if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                print(d['udid'], runtime_key, d['name'], sep='|'); sys.exit()
          ")
          echo "Selected simulator: $UDID (SDK $SDK_VERSION)"
          UDID=${UDID%%|*}
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID" # avoid stale data-migration state that can hang xcodebuild
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl shutdown "$UDID" # parallel clones need the runner's cores; leaving it booted has stalled launch 10+ min

      - name: Run iOS harness tests
        run: |
          set -o pipefail
          XCODEBUILD_COMMON=(
            -project iosApp/iosApp.xcodeproj
            -scheme Riffle
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
            -clonedSourcePackagesDirPath "$HOME/spm-packages"
            -derivedDataPath "$HOME/derived-data"
          )
          build_for_testing() {
            # Static K/N framework has no Xcode dependency edge; force relink so a warm cache doesn't ship stale Kotlin.
            rm -rf "$HOME"/derived-data/Build/Products/Debug-iphonesimulator/{Riffle.app,iosAppTests-Runner.app}
            xcodebuild build-for-testing "${XCODEBUILD_COMMON[@]}" 2>&1 | tee xcodebuild-harness.log
          }
          # dyld aborts if the app links a Swift overlay absent in the runtime (e.g. libswiftWebKit.dylib on iOS 18).
          check_swift_overlays() {
            local binary="$1"
            local runtime_root
            runtime_root=$(xcrun simctl list devices -j | python3 -c "
          import json, subprocess, sys
          udid = sys.argv[1]
          devices = json.load(sys.stdin)['devices']
          runtime_id = next(k for k, v in devices.items() if any(d['udid'] == udid for d in v))
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '-j']))['runtimes']
          print(next(r['runtimeRoot'] for r in runtimes if r['identifier'] == runtime_id))
          " "$SIMULATOR_UDID")
            echo "Runtime root: $runtime_root"
            local missing=0
            while read -r lib; do
              if [ ! -e "$runtime_root$lib" ]; then
                echo "::error::$binary links $lib, which does not exist in the selected simulator runtime — the app would abort in dyld at launch."
                missing=1
              fi
            done < <(otool -L "$binary" | awk '/\/usr\/lib\/swift\/.*dylib/ && !/weak/ {print $1}')
            return $missing
          }
          smoke_launch() {
            local app="$HOME/derived-data/Build/Products/Debug-iphonesimulator/Riffle.app"
            check_swift_overlays "$app/Riffle" || return 1
            xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$SIMULATOR_UDID" -b
            xcrun simctl install "$SIMULATOR_UDID" "$app"
            xcrun simctl launch --console-pty "$SIMULATOR_UDID" com.riffle.iosApp --RIFFLE_RESET_FOR_TESTS \
              > smoke-launch.log 2>&1 &
            local launch_pid=$!
            sleep 30
            local alive=0
            pgrep -f "Riffle.app/Riffle" > /dev/null && alive=1
            xcrun simctl terminate "$SIMULATOR_UDID" com.riffle.iosApp 2>/dev/null || true
            kill "$launch_pid" 2>/dev/null || true
            wait "$launch_pid" 2>/dev/null || true
            sleep 5 # CoreSimulator bridge outlives simctl shutdown; prevents deferred 0xFBFBFBFB force-quit on next launch
            echo "--- smoke-launch: app alive after 30 s = $alive"
            echo "--- smoke-launch console:"
            cat smoke-launch.log
            echo "--- crash reports:"
            for f in "$HOME"/Library/Logs/DiagnosticReports/Riffle*; do
              [ -e "$f" ] && { echo "== $f"; head -c 30000 "$f"; echo; }
            done
            echo "--- simulator log (Riffle / SpringBoard / runningboardd, last 3 min):"
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 3m \
              --predicate 'process == "Riffle" OR process == "SpringBoard" OR process == "runningboardd"' 2>/dev/null \
              | grep -iE "riffle|crash|exit|terminat|fail|error" | tail -150 || true
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
            [ "$alive" = 1 ]
          }
          run_harness() {
            rm -rf harness.xcresult
            xcodebuild test-without-building "${XCODEBUILD_COMMON[@]}" \
              -resultBundlePath "$PWD/harness.xcresult" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 420 \
              -maximum-test-execution-time-allowance 420 \
              2>&1 | tee -a xcodebuild-harness.log
          }
          # Unsigned app lacks application-identifier entitlement → Keychain writes fail → empty library in tests.
          # Code signing is therefore left enabled (ad-hoc "Sign to Run Locally"; no team needed on simulator).
          build_for_testing
          erase_and_wait() {
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
            xcrun simctl erase "$SIMULATOR_UDID" 2>/dev/null || true
            sleep 20 # post-erase migrations (LaunchServices, Keychain) run async; launching before they finish causes SpringBoard force-quit
          }
          if ! smoke_launch; then
            echo "::warning::Smoke-launch attempt 1 failed — erasing simulator and retrying."
            erase_and_wait
            if ! smoke_launch; then
              echo "::warning::Smoke-launch attempt 2 failed — erasing simulator and retrying once more."
              erase_and_wait
              if ! smoke_launch; then
                echo "::error::Riffle.app did not stay running for 30 s after 3 smoke-launch attempts — see the smoke-launch console above. Not running the suite."
                exit 1
              fi
            fi
          fi
          if run_harness; then
            exit 0
          fi
          # Infra signatures only; kept narrow so genuine test failures are never retried away.
          CRASH_RE='\(ipc/mig\) server died|Failed to launch app with identifier: com\.riffle|Unable to boot|Test runner never began executing|Lost connection to the test|Timed out while acquiring background assertion'
          if [ ! -d harness.xcresult ] || grep -qE "$CRASH_RE" xcodebuild-harness.log; then
            echo "::warning::Simulator infrastructure failure detected — retrying once on a clean simulator."
          else
            echo "Harness failed with genuine test failures (no simulator-infrastructure signature) — not retrying."
            exit 1
          fi
          xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl erase "$SIMULATOR_UDID" || true
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b || true
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          if run_harness; then exit 0; else exit 1; fi

      - name: Print failed harness tests
        if: always()
        run: |
          [ -d harness.xcresult ] || { echo "no harness.xcresult"; exit 0; }
          python3 .github/scripts/print-xcresult-failures.py harness.xcresult
      - name: Zip harness result bundle
        if: failure()
        run: ditto -c -k --keepParent harness.xcresult harness.xcresult.zip || true
      - name: Upload harness result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-harness-xcresult
          path: harness.xcresult.zip
          if-no-files-found: ignore
      - name: Upload harness log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-harness-log
          path: |
            xcodebuild-harness.log
            smoke-launch.log
          if-no-files-found: ignore
