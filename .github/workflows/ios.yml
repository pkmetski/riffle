name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ios-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Kotlin lint (iosMain source sets)
        run: |
          ./gradlew \
            :shared:ktlintIosMainSourceSetCheck \
            :core:database:ktlintIosMainSourceSetCheck \
            :core:net:ktlintIosMainSourceSetCheck \
            :core:data:ktlintIosMainSourceSetCheck \
            :core:logging:ktlintIosMainSourceSetCheck \
            :core:common:ktlintIosMainSourceSetCheck \
            :core:catalog-komga:ktlintIosMainSourceSetCheck \
            :feature:source-ui:ktlintCheck \
            :feature:reader-ui:ktlintCheck \
            :feature:player-ui:ktlintCheck \
            :feature:design-system:ktlintCheck \
            :feature:library-ui:ktlintCheck
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint (iosApp/)
        run: swiftlint lint iosApp/

  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Read Kotlin version
        id: kotlin-version
        run: |
          echo "version=$(grep '^kotlin = ' gradle/libs.versions.toml | sed 's/kotlin = "\(.*\)"/\1/')" >> $GITHUB_OUTPUT

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.kotlin-version.outputs.version }}

      - name: Assemble Riffle XCFramework
        run: ./gradlew assembleRiffleDebugXCFramework

      - name: Build Xcode project (simulator)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme Riffle \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

  unit-test:
    name: Unit Tests
    runs-on: macos-15
    timeout-minutes: 35
    concurrency:
      group: ios-unit-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          java-version: '17'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Read Xcode version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache SPM SourcePackages
        uses: actions/cache@v6
        with:
          path: ~/spm-packages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/derived-data
          key: derived-data-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-

      # Run every iOS-targeted module's commonTest on the iOS simulator so shared KMP logic is
      # verified on iOS, not just Android. core:database and core:data have their own jobs.
      - name: Run iOS commonTest (all iOS-targeted modules)
        run: |
          ./gradlew \
            :core:common:iosSimulatorArm64Test \
            :core:models:iosSimulatorArm64Test \
            :core:net:iosSimulatorArm64Test \
            :core:sources:iosSimulatorArm64Test \
            :core:catalog-oreilly:iosSimulatorArm64Test \
            :core:sync:iosSimulatorArm64Test \
            :core:domain:iosSimulatorArm64Test \
            :core:dictionary:iosSimulatorArm64Test \
            :core:catalog:iosSimulatorArm64Test \
            :core:catalog-komga:iosSimulatorArm64Test \
            :core:catalog-gutenberg:iosSimulatorArm64Test \
            :core:catalog-radio-es:iosSimulatorArm64Test \
            :core:catalog-chitanka:iosSimulatorArm64Test \
            :shared:iosSimulatorArm64Test \
            :feature:library:iosSimulatorArm64Test \
            :feature:navigation:iosSimulatorArm64Test \
            :feature:player:iosSimulatorArm64Test \
            :feature:reader:iosSimulatorArm64Test \
            :feature:reader-ui:iosSimulatorArm64Test \
            :feature:player-ui:iosSimulatorArm64Test \
            :feature:design-system:iosSimulatorArm64Test \
            :feature:library-ui:iosSimulatorArm64Test \
            :feature:source:iosSimulatorArm64Test \
            :feature:source-ui:iosSimulatorArm64Test \
            :feature:settings:iosSimulatorArm64Test \
            :feature:downloads:iosSimulatorArm64Test \
            :core:logging:iosSimulatorArm64Test

      - name: Upload iOS commonTest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-commontest-reports
          path: |
            core/models/build/reports/tests/
            core/net/build/reports/tests/
            core/sources/build/reports/tests/
            core/catalog-oreilly/build/reports/tests/
            core/sync/build/reports/tests/
            core/dictionary/build/reports/tests/
            core/catalog/build/reports/tests/
            core/catalog-komga/build/reports/tests/
            core/catalog-gutenberg/build/reports/tests/
            core/catalog-radio-es/build/reports/tests/
            core/catalog-chitanka/build/reports/tests/
            shared/build/reports/tests/
            feature/library/build/reports/tests/
            feature/player/build/reports/tests/
            feature/player-ui/build/reports/tests/
            feature/library-ui/build/reports/tests/
            feature/reader/build/reports/tests/
            feature/design-system/build/reports/tests/
            feature/source/build/reports/tests/
          if-no-files-found: ignore

      # Only the simulator slice is needed here: xcodebuild's embed phase links from
      # shared/build/bin/iosSimulatorArm64/debugFramework. assembleRiffleDebugXCFramework also
      # linked the arm64 device framework (~5 min) that nothing in this job uses.
      - name: Link Riffle simulator framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Select and pre-boot simulator
        run: |
          # Prefer the simulator runtime that matches the selected Xcode's iOS SDK. The runner image
          # also carries newer runtimes (e.g. iOS 26.x for Xcode 26); pairing Xcode 16.4 with an
          # iOS 26 device is unsupported and produced clone launch failures ("Failed to launch app
          # with identifier ...xctrunner") that serialised the whole suite onto one clone.
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | SDK_VERSION="$SDK_VERSION" python3 -c "
          import json, os, re, sys
          data = json.load(sys.stdin)
          sdk = os.environ['SDK_VERSION']
          def version(key):
            m = re.search(r'iOS-(\d+)-(\d+)', key)
            return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          sdk_major = int(sdk.split('.')[0])
          keys = [k for k in data['devices'] if 'iOS' in k]
          exact = [k for k in keys if version(k) == tuple(int(x) for x in sdk.split('.')[:2])]
          same_major = [k for k in keys if version(k)[0] == sdk_major]
          ordered = exact + sorted(set(same_major) - set(exact), key=version, reverse=True) + sorted(set(keys) - set(same_major), key=version, reverse=True)
          for runtime_key in ordered:
            for d in data['devices'][runtime_key]:
              if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                print(d['udid'], runtime_key, d['name'], sep='|'); sys.exit()
          ")
          echo "Selected simulator: $UDID (SDK $SDK_VERSION)"
          UDID=${UDID%%|*}
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Parallel testing boots clones of this device; hand the runner's cores to them.
          xcrun simctl shutdown "$UDID"

      - name: Run XCTest unit tests (iosAppUnitTests)
        # Riffle.framework is a static K/N framework that the KMP Embed Framework script phase
        # rsyncs into Products. Xcode's linker has no dependency edge to it, so on a warm
        # DerivedData cache a Kotlin-only change does NOT relink the app or the test bundles and
        # the tests run the previous build's Kotlin. Drop the linked products so Ld always runs.
        run: |
          rm -rf "$HOME"/derived-data/Build/Products/Debug-iphonesimulator/{Riffle.app,iosAppUnitTests.xctest,iosAppTests-Runner.app}
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosAppUnitTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" \
            -derivedDataPath "$HOME/derived-data" \
            -parallel-testing-enabled YES \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-unit-test.log; exit ${PIPESTATUS[0]}

      - name: Upload XCTest unit test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xctest-unit-test-log
          path: xcodebuild-unit-test.log
          if-no-files-found: ignore

  integration-test:
    name: Integration tests
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ios-integration-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          java-version: '17'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # iOS mirror of the "Android integration tests (core:data)" job.
      # Runs the core:data commonTest suite on the iOS simulator — covers DAO-backed stores
      # and the reading-session repository, exercising the data layer end-to-end on iOS.
      - name: Run iOS data-layer integration tests (core:data)
        run: ./gradlew :core:data:iosSimulatorArm64Test
      - name: Upload iOS integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-integration-test-reports
          path: core/data/build/reports/tests/
          if-no-files-found: ignore

  database-test:
    name: Database tests (core:database)
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ios-database-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          java-version: '17'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Dedicated iOS mirror of the "Android database tests (core:database)" job.
      - name: Run iOS database tests
        run: ./gradlew :core:database:iosSimulatorArm64Test
      - name: Upload iOS database test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-database-test-reports
          path: core/database/build/reports/tests/
          if-no-files-found: ignore

  harness-test-phone:
    name: Harness tests (phone)
    runs-on: macos-15
    timeout-minutes: 50
    concurrency:
      group: ios-harness-test-phone-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: 'false'

      - name: Read Xcode version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache SPM SourcePackages
        uses: actions/cache@v6
        with:
          path: ~/spm-packages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/derived-data
          key: derived-data-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-

      # Only the simulator slice is needed here: xcodebuild's embed phase links from
      # shared/build/bin/iosSimulatorArm64/debugFramework. assembleRiffleDebugXCFramework also
      # linked the arm64 device framework (~5 min) that nothing in this job uses.
      - name: Link Riffle simulator framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Select and pre-boot simulator
        run: |
          # Prefer the simulator runtime that matches the selected Xcode's iOS SDK. The runner image
          # also carries newer runtimes (e.g. iOS 26.x for Xcode 26); pairing Xcode 16.4 with an
          # iOS 26 device is unsupported and produced clone launch failures ("Failed to launch app
          # with identifier ...xctrunner") that serialised the whole suite onto one clone.
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | SDK_VERSION="$SDK_VERSION" python3 -c "
          import json, os, re, sys
          data = json.load(sys.stdin)
          sdk = os.environ['SDK_VERSION']
          def version(key):
            m = re.search(r'iOS-(\d+)-(\d+)', key)
            return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          sdk_major = int(sdk.split('.')[0])
          keys = [k for k in data['devices'] if 'iOS' in k]
          exact = [k for k in keys if version(k) == tuple(int(x) for x in sdk.split('.')[:2])]
          same_major = [k for k in keys if version(k)[0] == sdk_major]
          ordered = exact + sorted(set(same_major) - set(exact), key=version, reverse=True) + sorted(set(keys) - set(same_major), key=version, reverse=True)
          for runtime_key in ordered:
            for d in data['devices'][runtime_key]:
              if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                print(d['udid'], runtime_key, d['name'], sep='|'); sys.exit()
          ")
          echo "Selected simulator: $UDID (SDK $SDK_VERSION)"
          UDID=${UDID%%|*}
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          # Erase before boot to avoid stale data-migration state that causes xcodebuild to hang.
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # Parallel testing boots two clones of this device. Leaving the original booted makes
          # three simulators compete for the runner's three cores and has stalled app launch for
          # 10+ minutes; the warm-up above is enough, so hand the cores to the clones.
          xcrun simctl shutdown "$UDID"

      - name: Run iOS harness tests
        # Code signing stays enabled (ad-hoc "Sign to Run Locally", no team needed on the
        # simulator): an unsigned app has no application-identifier entitlement, so every
        # Keychain write fails with errSecMissingEntitlement. IosTokenStorage then never
        # persists the ABS/Komga token, the library refresh finds no token and the harness
        # sees an empty library after adding a source.
        run: |
          # See the unit-test step: force a relink so a warm DerivedData cache cannot ship stale Kotlin.
          rm -rf "$HOME"/derived-data/Build/Products/Debug-iphonesimulator/{Riffle.app,iosAppUnitTests.xctest,iosAppTests-Runner.app}
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" \
            -derivedDataPath "$HOME/derived-data" \
            -parallel-testing-enabled YES \
            2>&1 | tee xcodebuild-harness.log; exit ${PIPESTATUS[0]}

      - name: Upload harness log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-harness-log
          path: xcodebuild-harness.log
          if-no-files-found: ignore
