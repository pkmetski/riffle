name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: iOS lint
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ios-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Kotlin lint (iosMain source sets)
        run: |
          ./gradlew \
            :shared:ktlintIosMainSourceSetCheck \
            :core:database:ktlintIosMainSourceSetCheck \
            :core:net:ktlintIosMainSourceSetCheck \
            :core:data:ktlintIosMainSourceSetCheck \
            :core:logging:ktlintIosMainSourceSetCheck
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint (iosApp/)
        run: swiftlint lint iosApp/

  integration-tests:
    name: iOS integration tests
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: ios-integration-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run iOS integration tests
        run: |
          # Pick the latest available iPhone simulator on this runner dynamically.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime_key in sorted(data['devices'].keys(), reverse=True):
            for d in data['devices'][runtime_key]:
              if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                print(d['udid']); exit()
          ")
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-test.log; exit ${PIPESTATUS[0]}
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-integration-test-log
          path: xcodebuild-test.log
          if-no-files-found: ignore

  build:
    name: iOS build
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Assemble Riffle XCFramework
        run: ./gradlew assembleRiffleDebugXCFramework
      - name: Build Xcode project (simulator)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme Riffle \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

  commontest:
    name: iOS shared unit tests (commonTest)
    runs-on: macos-15
    timeout-minutes: 25
    concurrency:
      group: ios-commontest-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          java-version: '17'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Run every iOS-targeted module's commonTest on the iOS simulator target so shared
      # (Kotlin Multiplatform) logic is verified on iOS, not just Android. See
      # docs/testing/android-ios-parity-audit.md §3.
      - name: Run iOS commonTest (all iOS-targeted modules)
        run: |
          ./gradlew \
            :core:database:iosSimulatorArm64Test \
            :core:sync:iosSimulatorArm64Test \
            :shared:iosSimulatorArm64Test \
            :feature:library:iosSimulatorArm64Test \
            :feature:player:iosSimulatorArm64Test \
            :feature:reader:iosSimulatorArm64Test \
            :feature:source:iosSimulatorArm64Test
      - name: Upload iOS commonTest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-commontest-reports
          path: |
            core/database/build/reports/tests/
            core/sync/build/reports/tests/
            shared/build/reports/tests/
            feature/library/build/reports/tests/
            feature/player/build/reports/tests/
            feature/reader/build/reports/tests/
            feature/source/build/reports/tests/
          if-no-files-found: ignore
