name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: iOS lint
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ios-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Kotlin lint (iosMain source sets)
        run: |
          ./gradlew \
            :shared:ktlintIosMainSourceSetCheck \
            :core:database:ktlintIosMainSourceSetCheck \
            :core:net:ktlintIosMainSourceSetCheck \
            :core:data:ktlintIosMainSourceSetCheck \
            :core:logging:ktlintIosMainSourceSetCheck
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint (iosApp/)
        run: swiftlint lint iosApp/

  integration-tests:
    name: iOS integration tests
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: ios-integration-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: 'false'

      - name: Read Kotlin version
        id: kotlin-version
        run: |
          echo "version=$(grep '^kotlin = ' gradle/libs.versions.toml | sed 's/kotlin = "\(.*\)"/\1/')" >> $GITHUB_OUTPUT

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.kotlin-version.outputs.version }}

      - name: Cache SPM SourcePackages
        uses: actions/cache@v4
        with:
          path: ~/spm-packages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/derived-data
          key: derived-data-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            derived-data-${{ runner.os }}-

      - name: Select and pre-boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime_key in sorted(data['devices'].keys(), reverse=True):
            for d in data['devices'][runtime_key]:
              if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                print(d['udid']); exit()
          ")
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run iOS integration tests
        run: |
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" \
            -derivedDataPath "$HOME/derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-test.log; exit ${PIPESTATUS[0]}

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-integration-test-log
          path: xcodebuild-test.log
          if-no-files-found: ignore

  build:
    name: iOS build
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Assemble Riffle XCFramework
        run: ./gradlew assembleRiffleDebugXCFramework
      - name: Build Xcode project (simulator)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme Riffle \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

  database-test:
    name: iOS database tests (core:database)
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ios-database-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          java-version: '17'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run iOS database tests
        run: ./gradlew :core:database:iosSimulatorArm64Test :core:sync:iosSimulatorArm64Test
      - name: Upload iOS database test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-database-test-reports
          path: |
            core/database/build/reports/tests/
            core/sync/build/reports/tests/
          if-no-files-found: ignore
