name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Download Gradle wrapper jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v9.4.1/gradle/wrapper/gradle-wrapper.jar"
      - uses: actions/cache@v6
        with:
          path: app/src/main/assets/fonts
          key: fonts-v1-${{ hashFiles('Makefile') }}
          restore-keys: fonts-v1-
      - run: make fonts
      - run: ./gradlew assembleDebug

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # checkTestGuardrails (riffleChecks) diffs against the merge base with origin/main.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Download Gradle wrapper jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v9.4.1/gradle/wrapper/gradle-wrapper.jar"
      - uses: actions/cache@v6
        with:
          path: app/src/main/assets/fonts
          key: fonts-v1-${{ hashFiles('Makefile') }}
          restore-keys: fonts-v1-
      - run: make fonts
      # riffleChecks runs the custom lints + test guardrails; module `check` (their other hook)
      # is never invoked on CI, so they must be listed explicitly here.
      - run: ./gradlew lint riffleChecks
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Download Gradle wrapper jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v9.4.1/gradle/wrapper/gradle-wrapper.jar"
      - uses: actions/cache@v6
        with:
          path: app/src/main/assets/fonts
          key: fonts-v1-${{ hashFiles('Makefile') }}
          restore-keys: fonts-v1-
      - run: make fonts
      - run: ./gradlew test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            core/*/build/reports/tests/
          if-no-files-found: ignore

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Download Gradle wrapper jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v9.4.1/gradle/wrapper/gradle-wrapper.jar"
      - uses: actions/cache@v6
        with:
          path: app/src/main/assets/fonts
          key: fonts-v1-${{ hashFiles('Makefile') }}
          restore-keys: fonts-v1-
      - run: make fonts
      - run: ./gradlew :core:data:testDebugUnitTest -PintegrationTests
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: core/data/build/reports/tests/
          if-no-files-found: ignore

  # Instrumented Room tests (migrations + DAOs) need an emulator, so they run here on a
  # hardware-accelerated AVD rather than in the JVM jobs above.
  connected-test:
    name: Database tests (core:database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Download Gradle wrapper jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v9.4.1/gradle/wrapper/gradle-wrapper.jar"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run core:database connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: ./gradlew :core:database:connectedDebugAndroidTest
      - name: Upload connected-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-test-reports
          path: core/database/build/reports/androidTests/
          if-no-files-found: ignore

  harness-test-phone:
    name: Harness tests (phone)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Download Gradle wrapper jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v9.4.1/gradle/wrapper/gradle-wrapper.jar"
      - uses: actions/cache@v6
        with:
          path: app/src/main/assets/fonts
          key: fonts-v1-${{ hashFiles('Makefile') }}
          restore-keys: fonts-v1-
      - run: make fonts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run phone harness tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: google_apis
          arch: x86
          profile: pixel
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-boot-anim -no-audio -camera-back none -gpu swiftshader_indirect
          # API-25 WebView V8/Blink native pages persist in guest shared memory across
          # ./gradlew invocations on the same emulator. The default Pixel AVD RAM (1.5GB)
          # keeps the guest under enough memory pressure to evict those pages — but only
          # after ~90 seconds, not the ~30s gap from Gradle startup alone.
          # -memory 2048 was tried and made things WORSE: more RAM = less eviction pressure
          # = pages linger = the 3rd WebView open in shard 3 stalls for 90s.
          #
          # Three shards isolate the reader-opening tests:
          #   Shard 1: WakeLockHarnessTest only (1 WebView open, fresh renderer)
          #   sleep 90: gives the 1.5GB-pressured guest time to evict Shard 1's pages
          #   Shard 2: EpubHarnessTest only (2 WebView opens, renderer now clean)
          #   sleep 90: gives the guest time to evict Shard 2's pages
          #   Shard 3: everything else — AnnotationFocus (1 WebView) + 310 feature tests
          #            (natural GC gap) + NavSnap (2 WebViews); 3 total, passes reliably
          # notClass= accepts comma-separated class names (AndroidJUnitRunner parseCSV).
          script: adb logcat -G 16M || true; adb logcat -c || true; ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.riffle.app.harness.WakeLockHarnessTest; WAKELOCK_RC=$?; sleep 90; ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.riffle.app.harness.EpubHarnessTest; EPUB_RC=$?; sleep 90; ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.riffle.app.harness.WakeLockHarnessTest,com.riffle.app.harness.EpubHarnessTest -Pandroid.testInstrumentationRunnerArguments.notAnnotation=com.riffle.app.harness.TabletLayout; REST_RC=$?; adb logcat -d > logcat-phone.txt || true; [ $WAKELOCK_RC -eq 0 ] && [ $EPUB_RC -eq 0 ] && [ $REST_RC -eq 0 ]
      - name: Upload harness phone reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-test-phone-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
      - name: Upload phone logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-test-phone-logcat
          path: logcat-phone.txt
          if-no-files-found: ignore

  harness-test-tablet:
    name: Harness tests (tablet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Download Gradle wrapper jar
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v9.4.1/gradle/wrapper/gradle-wrapper.jar"
      - uses: actions/cache@v6
        with:
          path: app/src/main/assets/fonts
          key: fonts-v1-${{ hashFiles('Makefile') }}
          restore-keys: fonts-v1-
      - run: make fonts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tablet harness tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: google_apis
          arch: x86
          profile: Nexus 10
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-boot-anim -no-audio -camera-back none -gpu swiftshader_indirect
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.annotation=com.riffle.app.harness.TabletLayout
      - name: Upload harness tablet reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-test-tablet-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
